name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download FFmpeg Standalone
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegPath = Get-ChildItem -Path ffmpeg_extracted -Filter "ffmpeg.exe" -Recurse | Select-Object -ExpandProperty FullName
          Copy-Item $ffmpegPath -Destination "./ffmpeg.exe"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install customtkinter pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --add-data "src;src" --add-binary "ffmpeg.exe;." --name "TikTokLiveRecorderGUI" gui.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokLiveRecorderGUI-Windows
          path: dist/TikTokLiveRecorderGUI.exe
